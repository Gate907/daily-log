name: Daily Update

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update log
        run: echo "Updated on $(date -u '+%Y-%m-%d %H:%M:%S') UTC" >> log.md

      - name: Commit and push
        run: |
          git config user.name "Gate907"
          git config user.email "145821477+Gate907@users.noreply.github.com"
          git add log.md
          git commit -m "Daily update $(date -u +%F)"
          git push